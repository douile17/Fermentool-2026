<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Fermentool — Hex badge F</title>
  <defs>
    <linearGradient id="grad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00707f"/>
      <stop offset="1" stop-color="#10a074"/>
