    <g fill="#ffffff">
      <rect x="196" y="150" width="52" height="216" rx="8"/>
      <rect x="196" y="150" width="150" height="52" rx="8"/>
      <rect x="196" y="244" width="112" height="48" rx="8"/>
    </g>
  </g>
</svg>
