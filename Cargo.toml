[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# A bare `cargo test` / `cargo build` leaves the desktop shell out: its build
# script needs the sidecars that only `copy-sidecar.ps1` puts in
# `src-tauri/binaries`, and failed every test run on a PC without them.
# `cargo tauri build` (run in src-tauri) still builds it; `--workspace`
# includes it.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
authors = ["Andrew Zicler <andrew.zicler@uliege.be>"]
repository = ""
homepage = "https://www.delvigne-lab.com"

# Shared dependency versions are added here as later milestones introduce them
# (tokio, axum, tokio-serial, tokio-modbus, rusqlite, tracing, jiff, ...).
# See docs/FERMENTOOL.md §12.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
