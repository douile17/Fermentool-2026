[package]
name = "fermentool-camera"
description = "Camera helper: the pipe protocol between the daemon and the fermentool-camera capture process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# `capture` builds the helper binary (the webcam backend). The protocol, the
# request loop and the test pattern need none of it.
capture = ["dep:nokhwa"]

[dependencies]
serde.workspace = true
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
jpeg-encoder = "0.6"

[[bin]]
name = "fermentool-camera"
path = "src/main.rs"
required-features = ["capture"]
