[package]
name = "fermentool-camera"
description = "Camera helper: the pipe protocol between the daemon and the fermentool-camera capture process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# `capture` builds the helper binary (webcam grab + JPEG encode). The protocol
# library needs none of it.
capture = ["dep:nokhwa", "dep:jpeg-encoder"]

[dependencies]
serde.workspace = true
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
jpeg-encoder = { version = "0.6", optional = true }

[[bin]]
name = "fermentool-camera"
path = "src/main.rs"
required-features = ["capture"]
