[package]
name = "fermentool-core"
description = "Fermentool control daemon: curve engine, MODBUS link, journal, and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "fermentool-core"

[[bin]]
name = "fermentool-core"
path = "src/main.rs"

[dependencies]
fermentool-curves = { path = "../fermentool-curves" }
fermentool-modbus = { path = "../fermentool-modbus" }
rusqlite = { version = "0.32", features = ["bundled"] }
jiff = "0.2"
serde.workspace = true
serde_json = "1"
# Later milestones add: tokio, axum, tower-http, toml, tracing(+appender),
# anyhow, thiserror, rust-embed, clap. See docs/IMPLEMENTATION_PLAN.md §4.1.
