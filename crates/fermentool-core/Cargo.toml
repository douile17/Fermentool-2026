[package]
name = "fermentool-core"
description = "Fermentool control daemon: curve engine, MODBUS link, journal, HTTP API, and embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "fermentool-core"

[[bin]]
name = "fermentool-core"
path = "src/main.rs"

[dependencies]
fermentool-curves = { path = "../fermentool-curves" }
fermentool-modbus = { path = "../fermentool-modbus" }
serialport = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
jiff = { version = "0.2", features = ["serde"] }
serde.workspace = true
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
# Teams notifications (HTTPS POST to a Workflow webhook), on the notifier's
# own thread: a blocking client is the simple fit, rustls keeps the binary
# free of system TLS libraries.
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
