[package]
name = "fermentool-tauri"
description = "Fermentool desktop shell: a WebView2 window over the bundled UI, driving the detached fermentool-core daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "fermentool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
ureq = "2"
serde_json = "1"

[features]
# Tauri's production asset-embedding flag; `cargo tauri build` sets it.
custom-protocol = ["tauri/custom-protocol"]
